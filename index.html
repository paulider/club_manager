<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12150f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Club Manager MVP</title>
<style>
:root{--bg:#f2f3ef;--card:#fff;--ink:#151812;--muted:#7d8378;--line:#dde1d8;--green:#c9f06b;--good:#2f7a4a;--bad:#a9483d;--dark:#151912}
*{box-sizing:border-box}body{margin:0;background:#dfe2dc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Arial,sans-serif}
button,input{font:inherit}.shell{max-width:520px;margin:auto;min-height:100dvh;background:var(--bg);padding:0 14px 92px}
.top{position:sticky;top:0;z-index:5;background:rgba(242,243,239,.94);backdrop-filter:blur(18px);padding:15px 2px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.04)}
.brand{display:flex;gap:10px;align-items:center}.crest{width:38px;height:38px;border-radius:13px;background:var(--dark);color:var(--green);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:var(--muted);font-size:10px}.brand strong{font-size:14px}.budget{text-align:right}.budget small{display:block;color:var(--muted);font-size:9px}.budget b{font-size:14px}
.page{padding-top:13px}.hero{background:var(--dark);color:white;border-radius:26px;padding:18px;box-shadow:0 10px 30px rgba(22,27,18,.13)}.eyebrow{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#9aa294}.hero h1{font-size:24px;margin:6px 0 3px}.hero p{margin:0;color:#adb5a8;font-size:11px}
.match{margin-top:16px;background:#20251d;border-radius:20px;padding:15px}.matchrow{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;gap:8px}.team{text-align:center}.mark{width:48px;height:48px;margin:auto;border-radius:17px;background:#343b31;display:grid;place-items:center;font-weight:900;color:var(--green)}.team b{display:block;font-size:11px;margin-top:7px}.vs{text-align:center;font-weight:900;color:#7f887b}.primary{width:100%;height:48px;border:0;border-radius:15px;background:var(--green);font-weight:900;margin-top:14px;color:#17200d}.primary:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:20px}.stat{padding:14px}.stat small{font-size:9px;color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:5px}.card{padding:15px;margin-top:10px}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectiontitle b{font-size:13px}.sectiontitle span{font-size:9px;color:var(--muted)}
.feed{display:flex;flex-direction:column}.feeditem{padding:11px 0;border-top:1px solid var(--line)}.feeditem:first-child{border-top:0}.feeditem b{font-size:11px}.feeditem p{font-size:9px;color:var(--muted);margin:4px 0 0;line-height:1.35}
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:76px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:10}.tabs button{border:0;background:transparent;color:#888e84;font-size:9px;font-weight:800}.tabs button i{display:block;font-style:normal;font-size:18px;margin-bottom:3px}.tabs button.on{color:#161b12}
.pitch{background:linear-gradient(180deg,#45603e,#344f31);border-radius:24px;padding:18px 10px;min-height:430px;display:grid;grid-template-rows:repeat(4,1fr);gap:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}.line{display:flex;justify-content:space-around;align-items:center}.player{width:68px;border:0;background:transparent;color:white;text-align:center;padding:0}.shirt{width:44px;height:44px;border-radius:15px 15px 12px 12px;background:#f3f5ed;color:#16200f;display:grid;place-items:center;margin:auto;font-size:11px;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.18)}.player.sel .shirt{outline:3px solid var(--green)}.player small{display:block;font-size:8px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bench{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.bench button{flex:0 0 88px;border:1px solid var(--line);background:white;border-radius:15px;padding:10px;text-align:left}.bench button.sel{outline:2px solid var(--green)}.bench b{font-size:10px}.bench span{display:block;font-size:8px;color:var(--muted);margin-top:3px}
.filters{display:flex;gap:7px;overflow:auto;margin:10px 0}.filters button{flex:0 0 auto;border:1px solid var(--line);background:white;border-radius:12px;padding:8px 11px;font-size:9px;font-weight:800}.filters button.on{background:var(--dark);color:white}
.market{display:flex;flex-direction:column;gap:9px}.mrow{background:white;border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.mrow b{font-size:11px}.mrow small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.mrow button{border:0;background:var(--green);border-radius:11px;padding:9px 10px;font-size:9px;font-weight:900}.mrow button:disabled{background:#e9ece5;color:#a0a59b}.pill{display:inline-block;padding:3px 6px;border-radius:8px;background:#edf0e9;font-size:8px;margin-left:5px}
.table{overflow:hidden}.tr{display:grid;grid-template-columns:24px 1fr 28px 30px 34px;align-items:center;min-height:36px;border-top:1px solid var(--line);font-size:9px}.tr.head{border-top:0;color:var(--muted);font-size:8px}.tr.me{background:#eff8dc;border-radius:10px}.tr b{font-size:9px}
.stadium{height:220px;border-radius:24px;background:radial-gradient(circle at 50% 40%,#506348,#192017 72%);position:relative;overflow:hidden}.pitch2{position:absolute;width:185px;height:108px;left:50%;top:52%;transform:translate(-50%,-50%) rotateX(56deg);background:repeating-linear-gradient(90deg,#5c8052 0 14px,#658858 14px 28px);border:2px solid rgba(255,255,255,.8)}.stand{position:absolute;background:#555e51;border:1px solid #747e70}.n,.s{width:220px;height:32px;left:50%;transform:translateX(-50%) skewX(-20deg)}.n{top:28px}.s{bottom:24px}.w,.e{height:140px;width:31px;top:42px;transform:skewY(-20deg)}.w{left:42px}.e{right:42px}
.fac{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:10px}.fac:first-child{border-top:0}.dots i{display:inline-block;width:14px;height:5px;border-radius:4px;background:#e1e5dd;margin-left:3px}.dots i.on{background:var(--dark)}
.upgrade{background:#e8f1d7;border:1px solid #d5e1c1;border-radius:18px;padding:13px;margin-top:11px}.upgrade p{font-size:9px;color:#68705f}.upgrade button{width:100%;border:0;background:var(--dark);color:white;border-radius:12px;padding:12px;font-weight:850}
.morebtn{width:100%;border:1px solid #e0b7b1;background:#f4e2df;color:#9c4238;border-radius:14px;padding:13px;font-weight:800}
@media(min-width:521px){body{padding:18px 0}.shell{border-radius:30px;overflow:hidden;min-height:calc(100dvh - 36px)}}
</style>
</head>
<body>
<div class="shell"><header class="top" id="top"></header><main id="app"></main></div>
<nav class="tabs" id="tabs"></nav>
<script>
(function(){
var KEY="club_manager_mvp_011",tab="home",pick=null,filter="ALL";
var teamsN=[["Barcelona City","BCN"],["Madrid Athletic","MAD"],["Valencia CF","VAL"],["Sevilla United","SEV"],["Bilbao SC","BIL"],["Vigo 1923","VIG"],["Girona FC","GIR"],["Mallorca Club","MAL"],["Pamplona Reds","PAM"],["San Sebastian","SSB"],["Villarreal Coast","VIL"],["Getafe Azul","GET"],["Las Palmas 1949","LPA"],["Betis Verde","BET"],["Oviedo Norte","OVI"],["Alicante CF","ALI"],["Zaragoza 1932","ZAR"],["Coruna Atlantic","COR"],["Granada 1931","GRA"],["Tarragona FC","TAR"]];
var first=["Marc","Alex","Dani","Pau","Leo","Nico","Jan","Oriol","Joao","Lucas","Adrian","Hugo","Bruno","Enzo","Mateo","Iker","Mario","Sergio","Ruben","Victor"];
var last=["Torres","Navarro","Silva","Costa","Mendes","Santos","Roca","Vidal","Marti","Lopez","Garcia","Ruiz","Alonso","Molina","Pereira","Castro","Ortega","Campos","Soler","Miranda"];
var pos=["GK","RB","CB","CB","LB","CM","CM","AM","RW","LW","ST","GK","CB","RB","LB","CM","AM","RW","LW","ST","ST","CM"];
function R(s){var a=s>>>0;return function(){a+=1831565813;var t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function schedule(ids){var rot=ids.slice(),out=[],n=ids.length,r,i,a,b;for(r=0;r<n-1;r++){for(i=0;i<n/2;i++){a=rot[i];b=rot[n-1-i];if((r+i)%2)out.push({md:r+1,h:b,a:a});else out.push({md:r+1,h:a,a:b})}rot=[rot[0],rot[n-1]].concat(rot.slice(1,n-1))}var firstHalf=out.slice();firstHalf.forEach(function(f){out.push({md:f.md+n-1,h:f.a,a:f.h})});return out.map(function(f,i){f.id=i+1;f.played=false;return f})}
function fresh(){var random=R(804221),teams=teamsN.map(function(x,i){return{id:"t"+(i+1),name:x[0],short:x[1],rating:Math.round(70+random()*16),p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}}),players=[];teams.forEach(function(t,ti){pos.forEach(function(po,pi){var rt=Math.max(62,Math.min(88,t.rating-5+Math.round(random()*11))),age=18+Math.floor(random()*17),pot=Math.min(92,rt+Math.floor(random()*Math.max(2,12-Math.max(0,age-24)))),val=Math.max(.6,Math.round(((rt-55)*(rt-55))*(age<24?.12:age>30?.045:.08)*10)/10);players.push({id:"p"+ti+"_"+pi,name:first[(ti*3+pi)%first.length]+" "+last[(ti*7+pi*2)%last.length],age:age,pos:po,rt:rt,pot:pot,val:val,fit:88+Math.round(random()*12),form:65+Math.round(random()*30),club:t.id})})});var user="t1",sq=players.filter(function(p){return p.club===user}),want=["GK","RB","CB","CB","LB","CM","CM","AM","RW","LW","ST"],used={},xi=want.map(function(po){var q=sq.filter(function(p){return p.pos===po&&!used[p.id]}).sort(function(a,b){return b.rt-a.rt})[0]||sq.filter(function(p){return!used[p.id]}).sort(function(a,b){return b.rt-a.rt})[0];used[q.id]=1;return q.id}),bench=sq.filter(function(p){return!used[p.id]}).slice(0,9).map(function(p){return p.id});return{seed:804221,user:user,md:1,budget:34.2,teams:teams,players:players,fx:schedule(teams.map(function(t){return t.id})),xi:xi,bench:bench,cap:28450,north:8000,fac:{training:3,academy:2,pitch:4,lights:3},feed:[["Bienvenido","Revisa el once antes de simular la jornada 1."],["Mercado abierto","Puedes reforzar la plantilla dentro del presupuesto disponible."]]}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}var s=load();
function save(){localStorage.setItem(KEY,JSON.stringify(s))}function T(id){return s.teams.find(function(x){return x.id===id})}function P(id){return s.players.find(function(x){return x.id===id})}function money(n){return "€"+Number(n).toFixed(n>=10?1:2)+"M"}function table(){return s.teams.slice().sort(function(a,b){return b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf})}
function power(id){var arr=id===s.user?s.xi.map(P):s.players.filter(function(p){return p.club===id}).sort(function(a,b){return b.rt-a.rt}).slice(0,11);return arr.reduce(function(z,p){return z+p.rt*(.86+p.form/600)*(p.fit/100)},0)/arr.length}
function poisson(lam,rand){var L=Math.exp(-lam),k=0,p=1;do{k++;p*=rand()}while(p>L&&k<8);return k-1}function apply(t,gf,ga){t.p++;t.gf+=gf;t.ga+=ga;if(gf>ga){t.w++;t.pts+=3}else if(gf===ga){t.d++;t.pts++}else t.l++}
function next(){return s.fx.find(function(f){return f.md===s.md&&(f.h===s.user||f.a===s.user)})}
function sim(){if(s.md>38)return;var day=s.fx.filter(function(f){return f.md===s.md&&!f.played}),mine=null;day.forEach(function(f){var rand=R(s.seed+s.md*1009+f.id*37),d=power(f.h)-power(f.a),hg=poisson(Math.max(.3,Math.min(3.2,1.55+d*.045)),rand),ag=poisson(Math.max(.25,Math.min(3,1.16-d*.04)),rand);f.played=true;f.hg=hg;f.ag=ag;apply(T(f.h),hg,ag);apply(T(f.a),ag,hg);if(f.h===s.user||f.a===s.user)mine=f});if(mine){var home=mine.h===s.user,ug=home?mine.hg:mine.ag,og=home?mine.ag:mine.hg,inc=Math.round(s.cap*28/100000)/10;s.budget=Math.round((s.budget+inc)*100)/100;s.xi.forEach(function(id){var p=P(id);p.fit=Math.max(68,p.fit-4);p.form=Math.max(50,Math.min(99,p.form+(ug>og?3:ug<og?-2:0)))});s.players.forEach(function(p){if(p.club===s.user&&!s.xi.includes(p.id))p.fit=Math.min(100,p.fit+2)});s.feed.unshift([(ug>og?"Victoria":ug===og?"Empate":"Derrota")+": "+T(mine.h).short+" "+mine.hg+"-"+mine.ag+" "+T(mine.a).short,"Jornada "+s.md+" completada. Ingresos de partido: "+money(inc)+"."])}s.md++;save();render()}
function buy(id){var p=P(id);if(!p||p.club===s.user||p.val>s.budget)return;s.budget=Math.round((s.budget-p.val)*100)/100;p.club=s.user;p.fit=96;s.bench.push(p.id);s.feed.unshift(["Fichaje completado",p.name+" llega por "+money(p.val)+"."]);save();render()}
function upgrade(){if(s.north>=12000||s.budget<7.4)return;s.budget=Math.round((s.budget-7.4)*100)/100;s.north=12000;s.cap+=4000;s.feed.unshift(["Reforma completada","La grada norte gana 4.000 localidades."]);save();render()}
function swap(id){if(!pick){pick=id;render();return}if(pick===id){pick=null;render();return}var ai=s.xi.indexOf(pick),bi=s.xi.indexOf(id),ab=s.bench.indexOf(pick),bb=s.bench.indexOf(id),x;if(ai>=0&&bi>=0){x=s.xi[ai];s.xi[ai]=s.xi[bi];s.xi[bi]=x}else if(ab>=0&&bb>=0){x=s.bench[ab];s.bench[ab]=s.bench[bb];s.bench[bb]=x}else if(ai>=0&&bb>=0){s.xi[ai]=id;s.bench[bb]=pick}else if(bi>=0&&ab>=0){s.xi[bi]=pick;s.bench[ab]=id}pick=null;save();render()}
function top(){document.getElementById("top").innerHTML='<div class="brand"><div class="crest">CM</div><div><small>Temporada 26/27 · J'+Math.min(s.md,38)+'</small><strong>'+T(s.user).name+'</strong></div></div><div class="budget"><small>Presupuesto</small><b>'+money(s.budget)+'</b></div>'}
function nav(){var n=[["home","⌂","Inicio"],["team","◇","Equipo"],["market","↗","Mercado"],["club","▦","Club"],["more","•••","Más"]];document.getElementById("tabs").innerHTML=n.map(function(x){return'<button data-tab="'+x[0]+'" class="'+(tab===x[0]?"on":"")+'"><i>'+x[1]+'</i>'+x[2]+'</button>'}).join("")}
function home(){var f=next(),r=table().findIndex(function(t){return t.id===s.user})+1,opp=f?(f.h===s.user?T(f.a):T(f.h)):null;return'<div class="page"><section class="hero"><div class="eyebrow">Club Manager MVP</div><h1>'+(s.md<=38?"Jornada "+s.md:"Temporada completada")+'</h1><p>Decide rápido. Haz crecer el club.</p>'+(f?'<div class="match"><div class="matchrow"><div class="team"><div class="mark">'+T(f.h).short.slice(0,2)+'</div><b>'+T(f.h).name+'</b></div><div class="vs">VS</div><div class="team"><div class="mark">'+T(f.a).short.slice(0,2)+'</div><b>'+T(f.a).name+'</b></div></div><button class="primary" id="sim">SIMULAR JORNADA</button></div>':'')+'</section><div class="grid2"><div class="stat"><small>CLASIFICACIÓN</small><strong>'+r+'º</strong></div><div class="stat"><small>ESTADIO</small><strong>'+s.cap.toLocaleString("es-ES")+'</strong></div></div><section class="card"><div class="sectiontitle"><b>Situación</b><span>'+(opp?"Próximo: "+opp.short:"Final")+'</span></div><div class="grid2"><div class="stat"><small>PUNTOS</small><strong>'+T(s.user).pts+'</strong></div><div class="stat"><small>DIF. GOLES</small><strong>'+((T(s.user).gf-T(s.user).ga)>=0?"+":"")+(T(s.user).gf-T(s.user).ga)+'</strong></div></div></section><section class="card"><div class="sectiontitle"><b>Inbox</b><span>'+s.feed.length+' noticias</span></div><div class="feed">'+s.feed.slice(0,5).map(function(x){return'<div class="feeditem"><b>'+x[0]+'</b><p>'+x[1]+'</p></div>'}).join("")+'</div></section></div>'}
function pbutton(id){var p=P(id);return'<button class="player '+(pick===id?"sel":"")+'" data-player="'+id+'"><div class="shirt">'+p.rt+'</div><small>'+p.pos+' · '+p.name.split(" ")[0]+'</small></button>'}
function teamPage(){var lines=[[s.xi[10]],[s.xi[8],s.xi[7],s.xi[9]],[s.xi[5],s.xi[6]],[s.xi[1],s.xi[2],s.xi[3],s.xi[4]],[s.xi[0]]];return'<div class="page"><section class="card"><div class="sectiontitle"><b>Alineación · 4-2-3-1</b><span>Toca 2 jugadores para intercambiar</span></div><div class="pitch">'+lines.map(function(l){return'<div class="line">'+l.map(pbutton).join("")+'</div>'}).join("")+'</div></section><section class="card"><div class="sectiontitle"><b>Banquillo</b><span>'+s.bench.length+'</span></div><div class="bench">'+s.bench.map(function(id){var p=P(id);return'<button class="'+(pick===id?"sel":"")+'" data-player="'+id+'"><b>'+p.name+'</b><span>'+p.pos+' · '+p.rt+' · Físico '+p.fit+'</span></button>'}).join("")+'</div></section></div>'}
function marketPage(){var list=s.players.filter(function(p){return p.club!==s.user&&(filter==="ALL"||p.pos===filter)}).sort(function(a,b){return b.rt-a.rt}).slice(0,18),fs=["ALL","GK","CB","RB","LB","CM","AM","RW","LW","ST"];return'<div class="page"><section class="card"><div class="sectiontitle"><b>Mercado</b><span>'+money(s.budget)+' disponibles</span></div><div class="filters">'+fs.map(function(x){return'<button data-filter="'+x+'" class="'+(filter===x?"on":"")+'">'+x+'</button>'}).join("")+'</div><div class="market">'+list.map(function(p){return'<div class="mrow"><div><b>'+p.name+' <span class="pill">'+p.rt+'</span></b><small>'+p.pos+' · '+p.age+' años · Pot. '+p.pot+' · '+T(p.club).short+'</small><small>Valor: '+money(p.val)+'</small></div><button data-buy="'+p.id+'" '+(p.val>s.budget?"disabled":"")+'>FICHAR</button></div>'}).join("")+'</div></section></div>'}
function dots(v){var x="";for(var i=1;i<=5;i++)x+='<i class="'+(i<=v?"on":"")+'"></i>';return x}
function club(){return'<div class="page"><div class="stadium"><div class="stand n"></div><div class="stand s"></div><div class="stand w"></div><div class="stand e"></div><div class="pitch2"></div></div><section class="card"><div class="sectiontitle"><b>Estadio Central</b><span>'+s.cap.toLocaleString("es-ES")+' espectadores</span></div><div class="fac"><span>Entrenamiento</span><span class="dots">'+dots(s.fac.training)+'</span></div><div class="fac"><span>Cantera</span><span class="dots">'+dots(s.fac.academy)+'</span></div><div class="fac"><span>Césped</span><span class="dots">'+dots(s.fac.pitch)+'</span></div><div class="fac"><span>Iluminación</span><span class="dots">'+dots(s.fac.lights)+'</span></div><div class="upgrade"><b>Ampliación grada norte</b><p>'+(s.north>=12000?"Completada: +4.000 localidades.":"8.000 → 12.000 localidades · Coste 7,4M€")+'</p><button id="upgrade" '+(s.north>=12000||s.budget<7.4?"disabled":"")+'>'+(s.north>=12000?"REFORMA COMPLETADA":"INICIAR REFORMA")+'</button></div></section></div>'}
function more(){var rows=table();return'<div class="page"><section class="card table"><div class="sectiontitle"><b>Clasificación</b><span>J'+Math.max(0,s.md-1)+'</span></div><div class="tr head"><span>#</span><span>Club</span><span>PJ</span><span>DG</span><span>PTS</span></div>'+rows.map(function(t,i){return'<div class="tr '+(t.id===s.user?"me":"")+'"><span>'+(i+1)+'</span><b>'+t.name+'</b><span>'+t.p+'</span><span>'+((t.gf-t.ga)>=0?"+":"")+(t.gf-t.ga)+'</span><strong>'+t.pts+'</strong></div>'}).join("")+'</section><section class="card"><div class="sectiontitle"><b>Partida</b><span>Guardado local automático</span></div><button class="morebtn" id="reset">REINICIAR PARTIDA</button></section></div>'}
function render(){top();nav();document.getElementById("app").innerHTML=tab==="home"?home():tab==="team"?teamPage():tab==="market"?marketPage():tab==="club"?club():more();bind()}
function bind(){document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;pick=null;render()}});document.querySelectorAll("[data-player]").forEach(function(b){b.onclick=function(){swap(b.dataset.player)}});document.querySelectorAll("[data-filter]").forEach(function(b){b.onclick=function(){filter=b.dataset.filter;render()}});document.querySelectorAll("[data-buy]").forEach(function(b){b.onclick=function(){buy(b.dataset.buy)}});var x=document.getElementById("sim");if(x)x.onclick=sim;x=document.getElementById("upgrade");if(x)x.onclick=upgrade;x=document.getElementById("reset");if(x)x.onclick=function(){if(confirm("¿Reiniciar la partida?")){localStorage.removeItem(KEY);s=fresh();tab="home";render()}}}
render();
})();
</script>
</body>
</html>
