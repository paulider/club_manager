  const firstNames = ['Marc', 'Alex', 'Dani', 'Pau', 'Leo', 'Nico', 'Jan', 'Oriol', 'Joao', 'Lucas', 'Adrian', 'Hugo', 'Bruno', 'Enzo', 'Mateo', 'Iker', 'Mario', 'Sergio', 'Ruben', 'Victor'];
  const lastNames = ['Torres', 'Navarro', 'Silva', 'Costa', 'Mendes', 'Santos', 'Roca', 'Vidal', 'Marti', 'Lopez', 'Garcia', 'Ruiz', 'Alonso', 'Molina', 'Pereira', 'Castro', 'Ortega', 'Campos', 'Soler', 'Miranda'];
  const positions = ['GK', 'RB', 'CB', 'CB', 'LB', 'CM', 'CM', 'AM', 'RW', 'LW', 'ST', 'GK', 'CB', 'RB', 'LB', 'CM', 'AM', 'RW', 'LW', 'ST', 'ST', 'CM'];
  const desired = ['GK', 'RB', 'CB', 'CB', 'LB', 'CM', 'CM', 'AM', 'RW', 'LW', 'ST'];
  const POSITION_LABELS = { GK: 'Portero', RB: 'Lateral derecho', CB: 'Central', LB: 'Lateral izquierdo', CM: 'Mediocentro', AM: 'Mediapunta', RW: 'Extremo derecho', LW: 'Extremo izquierdo', ST: 'Delantero' };

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a += 0x6D2B79F5;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function fixtureSeed(id) {
    return Number(id.replace('fx-', '')) * 37;
  }

  function schedule(ids) {
    let rot = [...ids];
    const list = [];
    const n = ids.length;
    for (let r = 0; r < n - 1; r += 1) {
      for (let i = 0; i < n / 2; i += 1) {
        const a = rot[i];
        const b = rot[n - 1 - i];
        const flip = (r + i) % 2 === 0;
        list.push({ matchday: r + 1, homeId: flip ? a : b, awayId: flip ? b : a });
      }
      rot = [rot[0], rot[n - 1], ...rot.slice(1, n - 1)];
    }
    const secondRound = list.map((f) => ({ matchday: f.matchday + n - 1, homeId: f.awayId, awayId: f.homeId }));
    return [...list, ...secondRound].map((f, i) => ({ id: `fx-${i + 1}`, ...f, played: false }));
  }

  function createGame() {
    const seed = 804221;
    const random = rng(seed);
    const teams = TEAM_DEFS.map((def, i) => ({
      id: `team-${i + 1}`,
      name: def.name,
      short: def.short,
      rating: Math.round(70 + random() * 16),
      played: 0,
      won: 0,
      drawn: 0,
      lost: 0,
      gf: 0,
      ga: 0,
      points: 0,
    }));

    const players = [];
    teams.forEach((team, ti) => positions.forEach((position, pi) => {
      const base = Math.max(62, Math.min(88, team.rating - 5 + Math.round(random() * 11)));
      const age = 18 + Math.floor(random() * 17);
      const potential = Math.min(92, base + Math.floor(random() * Math.max(2, 12 - Math.max(0, age - 24))));
      const value = Math.max(0.6, Math.round(((base - 55) ** 2) * (age < 24 ? 0.12 : age > 30 ? 0.045 : 0.08) * 10) / 10);
      players.push({
        id: `p-${ti + 1}-${pi + 1}`,
        name: `${firstNames[(ti * 3 + pi) % firstNames.length]} ${lastNames[(ti * 7 + pi * 2) % lastNames.length]}`,
        age,
        position,
        rating: base,
        potential,
        value,
        wage: Math.round(base * base / 38),
        morale: 72 + Math.round(random() * 22),
        fitness: 88 + Math.round(random() * 12),
        form: 65 + Math.round(random() * 30),
        clubId: team.id,
      });
    }));

    const userTeamId = teams[0].id;
    const squad = players.filter((p) => p.clubId === userTeamId);
    const used = new Set();
    const lineup = desired.map((pos) => {
      const fit = squad.filter((p) => p.position === pos && !used.has(p.id)).sort((a, b) => b.rating - a.rating)[0]
        || squad.filter((p) => !used.has(p.id)).sort((a, b) => b.rating - a.rating)[0];
      used.add(fit.id);
      return fit.id;
    });
    const bench = squad.filter((p) => !used.has(p.id)).slice(0, 9).map((p) => p.id);

    return {
      version: 2,
      seed,
      userTeamId,
      currentMatchday: 1,
      budget: 34.2,
      teams,
      players,
      fixtures: schedule(teams.map((t) => t.id)),
      lineup,
      bench,
      stadium: { level: 0 },
      finance: [{ id: 'fin-start', label: 'Presupuesto inicial', amount: 34.2, matchday: 0 }],
      inbox: [
        { id: 'in-1', type: 'urgent', title: 'Primer partido', body: 'Revisa el once antes de simular la jornada 1.' },
        { id: 'in-2', type: 'info', title: 'Mercado abierto', body: 'La dirección autoriza operaciones dentro del presupuesto disponible.' },
      ],
    };
  }

  function normalizeState(raw) {
    if (!raw || !raw.teams || !raw.players) return createGame();
    const fresh = createGame();
    const merged = {
      ...fresh,
      ...raw,
      teams: raw.teams || fresh.teams,
      players: raw.players || fresh.players,
      fixtures: raw.fixtures || fresh.fixtures,
      lineup: Array.isArray(raw.lineup) && raw.lineup.length ? raw.lineup : fresh.lineup,
      bench: Array.isArray(raw.bench) ? raw.bench : fresh.bench,
      finance: Array.isArray(raw.finance) ? raw.finance : fresh.finance,
      inbox: Array.isArray(raw.inbox) ? raw.inbox : fresh.inbox,
    };
    const oldLevel = raw?.stadium?.northStand >= 12000 ? 1 : 0;
    merged.stadium = { level: Number.isFinite(raw?.stadium?.level) ? raw.stadium.level : oldLevel };
    merged.stadium.level = Math.max(0, Math.min(STADIUM_STAGES.length - 1, merged.stadium.level));
    merged.version = 2;
    return merged;
  }

  function load() {
    try {
      const current = localStorage.getItem(SAVE_KEY);
      if (current) return normalizeState(JSON.parse(current));
      const legacy = localStorage.getItem(OLD_SAVE_KEY);
      if (legacy) return normalizeState(JSON.parse(legacy));
    } catch (error) {
      console.warn('No se pudo leer la partida guardada', error);
    }
    return null;
  }

  let state = load() || createGame();

  function save() {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  }

  function team(id) { return state.teams.find((t) => t.id === id); }
  function player(id) { return state.players.find((p) => p.id === id); }
  function teamDef(short) { return TEAM_LOOKUP[short]; }
  function fmtM(n) { return `€${Number(n).toFixed(Math.abs(n) >= 10 ? 1 : 2)}M`; }
  function fmtK(n) { return `€${Math.round(n)}k`; }
  function stadiumStage(level = state.stadium.level) { return STADIUM_STAGES[level]; }
  function table() { return [...state.teams].sort((a, b) => b.points - a.points || ((b.gf - b.ga) - (a.gf - a.ga)) || b.gf - a.gf); }
  function nextFixture() { return state.fixtures.find((f) => f.matchday === state.currentMatchday && (f.homeId === state.userTeamId || f.awayId === state.userTeamId)); }

  function strength(teamId, user = false) {
    const t = team(teamId);
    const squad = state.players.filter((p) => p.clubId === teamId);
    const pool = user ? state.lineup.map(player) : squad.sort((a, b) => b.rating - a.rating).slice(0, 11);
    const avg = pool.reduce((sum, p) => sum + p.rating * (0.82 + p.form / 500) * (0.85 + p.fitness / 650), 0) / pool.length;
    return avg * 0.82 + t.rating * 0.18;
  }

  function poisson(lambda, random) {
    const L = Math.exp(-lambda);
    let k = 0;
    let p = 1;
    do {
      k += 1;
      p *= random();
    } while (p > L && k < 9);
    return k - 1;
  }

  function simFixture(f) {
    const random = rng(state.seed + state.currentMatchday * 1009 + fixtureSeed(f.id));
    const h = strength(f.homeId, f.homeId === state.userTeamId);
    const a = strength(f.awayId, f.awayId === state.userTeamId);
    const diff = h - a;
    const hl = Math.max(0.35, Math.min(3.3, 1.42 + diff * 0.045 + 0.23));
    const al = Math.max(0.3, Math.min(3, 1.18 - diff * 0.04));
    return { ...f, played: true, homeGoals: poisson(hl, random), awayGoals: poisson(al, random) };
  }

  function applyResult(t, gf, ga) {
    const w = gf > ga ? 1 : 0;
    const d = gf === ga ? 1 : 0;
    const l = gf < ga ? 1 : 0;
    return { ...t, played: t.played + 1, won: t.won + w, drawn: t.drawn + d, lost: t.lost + l, gf: t.gf + gf, ga: t.ga + ga, points: t.points + w * 3 + d };
  }

  function userRecentForm() {
    return state.fixtures
      .filter((f) => f.played && (f.homeId === state.userTeamId || f.awayId === state.userTeamId))
      .slice(-5)
      .map((f) => {
        const isHome = f.homeId === state.userTeamId;
        const gf = isHome ? f.homeGoals : f.awayGoals;
        const ga = isHome ? f.awayGoals : f.homeGoals;
        return gf > ga ? 'W' : gf === ga ? 'D' : 'L';
      })
      .reverse();
  }

  function getSquadNeed() {
    const weakest = state.lineup.map(player).sort((a, b) => a.rating - b.rating)[0];
    return weakest ? weakest.position : 'ST';
  }

  function simulateMatchday() {
    const todays = state.fixtures.filter((f) => f.matchday === state.currentMatchday && !f.played);
    if (!todays.length) return;
    const sims = todays.map(simFixture);
    sims.forEach((f) => {
      state.teams = state.teams.map((t) => (t.id === f.homeId ? applyResult(t, f.homeGoals, f.awayGoals)
        : t.id === f.awayId ? applyResult(t, f.awayGoals, f.homeGoals)
          : t));
    });
    const map = new Map(sims.map((f) => [f.id, f]));
    state.fixtures = state.fixtures.map((f) => map.get(f.id) || f);
    const ur = sims.find((f) => f.homeId === state.userTeamId || f.awayId === state.userTeamId);
    state.lastResult = ur;
    const isHome = ur.homeId === state.userTeamId;
    const ug = isHome ? ur.homeGoals : ur.awayGoals;
    const og = isHome ? ur.awayGoals : ur.homeGoals;
    const income = Math.round((stadiumStage().capacity * (0.72 + Math.min(0.23, state.currentMatchday / 150)) * 31) / 10000) / 100;
    state.players = state.players.map((p) => (state.lineup.includes(p.id)
      ? { ...p, fitness: Math.min(100, Math.max(65, p.fitness - 6 - (p.age > 30 ? 2 : 0)) + 3), form: Math.max(50, Math.min(99, p.form + (ug > og ? 3 : ug === og ? 0 : -2))) }
      : p));
    state.budget = Math.round((state.budget + income) * 100) / 100;
    state.finance.push({ id: `fin-${Date.now()}`, label: 'Ingresos jornada', amount: income, matchday: state.currentMatchday });
    const title = ug > og ? 'Victoria' : ug === og ? 'Empate' : 'Derrota';
    state.inbox = [{
      id: `res-${state.currentMatchday}`,
      type: ug > og ? 'success' : 'info',
      title: `${title}: ${team(ur.homeId).short} ${ur.homeGoals}–${ur.awayGoals} ${team(ur.awayId).short}`,
      body: `Jornada ${state.currentMatchday} completada. Ingresos de partido: ${fmtM(income)}.`,
    }, ...state.inbox].slice(0, 8);
    state.currentMatchday = Math.min(38, state.currentMatchday + 1);
    save();
    render();
  }

  function buy(id) {
    const p = player(id);
    if (!p || p.clubId === state.userTeamId || p.value > state.budget) return;
    const oldClub = team(p.clubId).name;
    const fee = p.value;
    p.clubId = state.userTeamId;
    p.morale = Math.max(82, p.morale);
    p.form = Math.max(p.form, 72);
    if (!state.lineup.includes(id) && !state.bench.includes(id)) {
      state.bench.unshift(id);
      state.bench = state.bench.slice(0, 12);
    }
    state.budget = Math.round((state.budget - fee) * 100) / 100;
    state.finance.push({ id: `buy-${id}`, label: `Fichaje ${p.name}`, amount: -fee, matchday: state.currentMatchday });
    state.inbox = [{
      id: `buy-${id}-${Date.now()}`,
      type: 'success',
      title: 'Fichaje completado',
      body: `${p.name} llega desde ${oldClub} por ${fmtM(fee)} y entra en la plantilla.`,
    }, ...state.inbox].slice(0, 8);
    detailPlayer = p;
    save();
    render();
  }

  function upgrade() {
    const current = stadiumStage();
    if (current.nextCost == null || state.stadium.level >= STADIUM_STAGES.length - 1) return;
    if (state.budget < current.nextCost) return;
    state.budget = Math.round((state.budget - current.nextCost) * 100) / 100;
    state.stadium.level += 1;
    const next = stadiumStage();
    state.finance.push({ id: `stadium-${next.key}-${Date.now()}`, label: next.label, amount: -current.nextCost, matchday: state.currentMatchday });
    state.inbox = [{
      id: `stadium-${next.key}-${Date.now()}`,
      type: 'success',
      title: `Reforma completada · ${next.label}`,
      body: `${next.subtitle} Nuevo aforo: ${next.capacity.toLocaleString('es-ES')} espectadores.`,
    }, ...state.inbox].slice(0, 8);
    save();
    render();
  }

  function swap(a, b) {
    const li = state.lineup;
    const be = state.bench;
    const ai = li.indexOf(a);
    const bi = li.indexOf(b);
    const ab = be.indexOf(a);
    const bb = be.indexOf(b);
    if (ai >= 0 && bi >= 0) [li[ai], li[bi]] = [li[bi], li[ai]];
    else if (ab >= 0 && bb >= 0) [be[ab], be[bb]] = [be[bb], be[ab]];
    else if (ai >= 0 && bb >= 0) { li[ai] = b; be[bb] = a; }
    else if (bi >= 0 && ab >= 0) { li[bi] = a; be[ab] = b; }
    save();
  }

  function tapPlayer(id) {
    if (!selectedPlayer) {
      selectedPlayer = id;
      render();
      return;
    }
    if (selectedPlayer === id) {
      detailPlayer = player(id);
      selectedPlayer = null;
      render();
      return;
    }
    swap(selectedPlayer, id);
    selectedPlayer = null;
    render();
  }

  function motifShape(def) {
    const fill = def.palette[2] || '#f3d27a';
    switch (def.symbol) {
      case 'tower':
        return `<g fill="${fill}"><rect x="46" y="28" width="8" height="22" rx="2"/><rect x="34" y="36" width="8" height="14" rx="2"/><rect x="58" y="36" width="8" height="14" rx="2"/><circle cx="50" cy="24" r="4"/></g>`;
      case 'crown':
        return `<path d="M28 48 L36 32 L50 44 L64 32 L72 48 L72 56 L28 56 Z" fill="${fill}" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>`;
      case 'bat':
        return `<path d="M26 52 Q34 38 42 48 Q50 34 58 48 Q66 38 74 52 L66 58 Q58 54 50 60 Q42 54 34 58 Z" fill="${fill}"/>`;
      case 'arch':
        return `<path d="M32 58 V46 Q32 30 50 30 Q68 30 68 46 V58 H60 V46 Q60 38 50 38 Q40 38 40 46 V58 Z" fill="${fill}"/>`;
      case 'ship':
        return `<g fill="${fill}"><path d="M30 56 H70 L61 65 H39 Z"/><path d="M48 32 H52 V52 H48 Z"/><path d="M52 34 L67 45 H52 Z"/></g>`;
      case 'wave':
        return `<path d="M28 52 C36 44 44 60 52 52 C60 44 68 60 76 52" fill="none" stroke="${fill}" stroke-width="6" stroke-linecap="round"/>`;
      case 'star':
        return `<path d="M50 30 L55 43 L69 43 L58 51 L62 64 L50 56 L38 64 L42 51 L31 43 L45 43 Z" fill="${fill}"/>`;
      case 'sun':
        return `<g fill="${fill}"><circle cx="50" cy="46" r="11"/>${Array.from({ length: 8 }).map((_, i) => {
          const angle = (Math.PI * 2 * i) / 8;
          const x1 = 50 + Math.cos(angle) * 16;
          const y1 = 46 + Math.sin(angle) * 16;
          const x2 = 50 + Math.cos(angle) * 23;
          const y2 = 46 + Math.sin(angle) * 23;
          return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${fill}" stroke-width="3" stroke-linecap="round"/>`;
        }).join('')}</g>`;
      case 'cross':
        return `<g fill="${fill}"><rect x="45" y="31" width="10" height="30" rx="2"/><rect x="34" y="42" width="32" height="10" rx="2"/></g>`;
      case 'bridge':
        return `<path d="M28 58 Q38 42 50 42 Q62 42 72 58" fill="none" stroke="${fill}" stroke-width="6" stroke-linecap="round"/><path d="M32 58 V64 M44 50 V64 M56 50 V64 M68 58 V64" stroke="${fill}" stroke-width="4"/>`;
      case 'diamond':
        return `<path d="M50 28 L68 46 L50 64 L32 46 Z" fill="${fill}"/>`;
      case 'anchor':
        return `<path d="M50 29 a6 6 0 1 1 0 12 a6 6 0 0 1 0 -12 M50 41 V61 M38 53 C38 63 44 68 50 68 C56 68 62 63 62 53 M38 53 H31 M62 53 H69" fill="none" stroke="${fill}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
      case 'lion':
        return `<text x="50" y="60" text-anchor="middle" font-size="32" font-weight="900" fill="${fill}" font-family="Arial, sans-serif">L</text>`;
      case 'seed':
        return `<path d="M50 30 C60 40 60 55 50 66 C40 55 40 40 50 30 Z" fill="${fill}"/><circle cx="50" cy="52" r="3" fill="#ffffff" fill-opacity=".5"/>`;
      case 'torch':
        return `<path d="M50 30 C57 36 56 44 50 49 C44 44 43 36 50 30 Z" fill="${fill}"/><rect x="46" y="49" width="8" height="16" rx="3" fill="${fill}"/>`;
      default:
        return `<circle cx="50" cy="48" r="12" fill="${fill}"/>`;
    }
  }

  function svgCrest(def) {
    const [primary, secondary, accent] = def.palette;
    return `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" aria-hidden="true">
        <defs>
          <clipPath id="clip-${def.short}"><path d="M50 5 L84 15 V53 C84 73 71 88 50 102 C29 88 16 73 16 53 V15 Z"/></clipPath>
          <linearGradient id="g-${def.short}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${primary}"/>
            <stop offset="100%" stop-color="${secondary}"/>
          </linearGradient>
        </defs>
        <path d="M50 5 L84 15 V53 C84 73 71 88 50 102 C29 88 16 73 16 53 V15 Z" fill="url(#g-${def.short})" stroke="${accent}" stroke-width="4"/>
        <g clip-path="url(#clip-${def.short})">
          <rect x="0" y="0" width="100" height="110" fill="${primary}"/>
          <rect x="16" y="18" width="68" height="38" fill="${secondary}" fill-opacity=".88"/>
          <rect x="24" y="18" width="8" height="82" fill="#ffffff" fill-opacity=".18"/>
          <rect x="40" y="18" width="6" height="82" fill="#ffffff" fill-opacity=".12"/>
          <rect x="58" y="18" width="6" height="82" fill="#ffffff" fill-opacity=".12"/>
          <rect x="72" y="18" width="8" height="82" fill="#ffffff" fill-opacity=".18"/>
          <circle cx="50" cy="47" r="18" fill="#ffffff" fill-opacity=".14"/>
          ${motifShape(def)}
          <path d="M22 78 H78 L70 93 H30 Z" fill="rgba(0,0,0,.22)"/>
          <text x="50" y="90" text-anchor="middle" font-size="16" font-weight="800" fill="${accent}" font-family="Arial, sans-serif">${def.short}</text>
        </g>
      </svg>`;
  }

  function crestSrc(short) {
    const def = teamDef(short);
    if (def.crest) return def.crest;
    return `data:image/svg+xml;utf8,${encodeURIComponent(svgCrest(def))}`;
  }

  function mark(short, size = 'md') {
    const def = teamDef(short);
    return `<div class="teamMark ${size}" title="${def.name}"><img class="crestImg" src="${crestSrc(short)}" alt="Escudo ${def.name}" loading="lazy"/></div>`;

  function rating(v) {
    const c = v >= 82 ? 'elite' : v >= 77 ? 'good' : v >= 72 ? 'mid' : 'low';
    return `<span class="ratingPill ${c}">${v}</span>`;
  }

  function nav() {
    const items = [['home', '⌂', 'Inicio'], ['team', '◇', 'Equipo'], ['market', '↗', 'Mercado'], ['club', '▦', 'Club'], ['more', '•••', 'Más']];
    return `<nav class="bottomNav">${items.map(([id, ic, lab]) => `<button data-nav="${id}" class="${tab === id ? 'active' : ''}"><i>${ic}</i><span>${lab}</span></button>`).join('')}</nav>`;
  }

          <div class="sheetStats">

            <div><span>Valor</span><strong>${fmtM(p.value)}</strong></div>

            <div><span>Posición</span><strong>${p.position}</strong></div>
          </div>
          <button class="secondaryButton full" data-close-sheet="true">Cerrar</button>
        </div>
      </div>`;
  }

  function home() {
    const club = team(state.userTeamId);
    const fixture = nextFixture();
    const isHome = fixture ? fixture.homeId === state.userTeamId : true;

    const forms = userRecentForm();
    const stage = stadiumStage();
    return `
      <div class="screen">
        <header class="topbar">
          <div class="topbarBrand">${mark(club.short, 'md')}<div><div class="eyebrow">CLUB MANAGER</div><h1>${club.name}</h1></div></div>
          <div class="budget"><span>Disponible</span><strong>${fmtM(state.budget)}</strong></div>
        </header>
        <section class="heroCard">
          <div class="heroMeta"><span>PRÓXIMO PARTIDO</span><span>${isHome ? 'EN CASA' : 'FUERA'}</span></div>
          <div class="versus">
            <div class="side">${mark(club.short, 'lg')}<strong>${club.short}</strong><span>${club.rating}</span></div>

        <section class="twoCol">
          <div class="metricCard"><span>CLASIFICACIÓN</span><strong>${pos}<sup>º</sup></strong><small>${club.points} puntos</small></div>
          <div class="metricCard"><span>FORMA</span><div class="formDots">${[0, 1, 2, 3, 4].map((i) => `<i class="${forms[i] ? `form ${forms[i]}` : 'form empty'}">${forms[i] || '·'}</i>`).join('')}</div><small>${club.won}V · ${club.drawn}E · ${club.lost}D</small></div>
        </section>

          <div class="inboxList">${state.inbox.slice(0, 3).map((x) => `<div class="inboxItem"><i class="${x.type}"></i><div><strong>${x.title}</strong><span>${x.body}</span></div></div>`).join('')}</div>
        </section>
      </div>`;

  const fieldSlots = [{ i: 10, x: 50, y: 12 }, { i: 8, x: 20, y: 30 }, { i: 7, x: 50, y: 32 }, { i: 9, x: 80, y: 30 }, { i: 5, x: 34, y: 51 }, { i: 6, x: 66, y: 51 }, { i: 4, x: 16, y: 69 }, { i: 2, x: 38, y: 73 }, { i: 3, x: 62, y: 73 }, { i: 1, x: 84, y: 69 }, { i: 0, x: 50, y: 89 }];

  function teamScreen() {
    const avg = Math.round(state.lineup.reduce((sum, id) => sum + player(id).rating, 0) / 11);
    const club = team(state.userTeamId);
    return `
      <div class="screen">
        <header class="topbar compact">
          <div class="topbarBrand">${mark(club.short, 'md')}<div><div class="eyebrow">EQUIPO</div><h1>Once inicial</h1></div></div>
          <div class="squadAvg"><span>XI</span><strong>${avg}</strong></div>
        </header>
        <div class="formationBar"><span>4–2–3–1</span><small>${selectedPlayer ? 'Selecciona otro jugador para intercambiar' : 'Toca dos jugadores para intercambiar'}</small></div>
        <div class="pitch">
          <div class="pitchLine center"></div><div class="pitchCircle"></div><div class="box top"></div><div class="box bottom"></div>
          ${fieldSlots.map((s) => {
            const p = player(state.lineup[s.i]);
            return `<button class="fieldPlayer ${selectedPlayer === p.id ? 'selected' : ''}" style="left:${s.x}%;top:${s.y}%" data-player="${p.id}"><span class="shirt">${p.position}</span><strong>${p.name.split(' ').pop()}</strong><small>${p.rating}</small></button>`;
          }).join('')}
        </div>
        <section class="sectionBlock benchBlock">
          <div class="sectionHeader"><div><span>PLANTILLA</span><h3>Banquillo</h3></div><small>${state.bench.length} jugadores</small></div>
          <div class="benchList">${state.bench.map((id) => {
            const p = player(id);
            return `<button class="benchPlayer ${selectedPlayer === id ? 'selected' : ''}" data-player="${id}"><span class="positionTag">${p.position}</span><div><strong>${p.name}</strong><small>${p.age} años · Físico ${p.fitness}%</small></div>${rating(p.rating)}</button>`;
          }).join('')}</div>
        </section>

  function market() {
    const need = getSquadNeed();
    const candidates = state.players
      .filter((p) => p.clubId !== state.userTeamId && (marketFilter === 'ALL' || p.position === marketFilter))
      .sort((a, b) => (b.potential + b.rating) - (a.potential + a.rating))
      .slice(0, 14);
    const filters = ['ALL', 'GK', 'CB', 'CM', 'AM', 'RW', 'LW', 'ST'];
    return `
      <div class="screen">
        <header class="topbar compact">
          <div><div class="eyebrow">MERCADO</div><h1>Scouting</h1></div>
          <div class="budget"><span>Disponible</span><strong>${fmtM(state.budget)}</strong></div>
        </header>
        <div class="needCard"><div><span>PRIORIDAD</span><strong>${POSITION_LABELS[need] || need}</strong></div><div class="needSignal"><i></i><i></i><i></i></div></div>
        <div class="filterRow">${filters.map((f) => `<button data-filter="${f}" class="${marketFilter === f ? 'active' : ''}">${f}</button>`).join('')}</div>
        <div class="marketList">${candidates.map((p) => {
          const c = team(p.clubId);
          const can = p.value <= state.budget;
          return `<div class="marketCard">
            <button class="marketInfo" data-detail="${p.id}">
              ${mark(c.short, 'md')}
              <div class="marketText"><div><span class="positionTag">${p.position}</span><small>${p.age} años · ${c.short}</small></div><strong>${p.name}</strong><span>Potencial estimado ${Math.max(p.rating, p.potential - 3)}–${p.potential}</span></div>

            </button>
            <div class="marketAction"><div><span>Valor</span><strong>${fmtM(p.value)}</strong></div><button data-buy="${p.id}" ${can ? '' : 'disabled'}>${can ? 'Fichar' : 'Sin presupuesto'}</button></div>
          </div>`;
        }).join('')}</div>
      </div>`;
  }

    const current = stadiumStage();
    const next = state.stadium.level < STADIUM_STAGES.length - 1 ? STADIUM_STAGES[state.stadium.level + 1] : null;
    const levels = [['Hospitality', current.hospitality], ['Césped', current.pitch], ['Iluminación', current.lighting], ['Academia', current.academy], ['Entrenamiento', current.training]];
    return `
      <div class="screen">
        <header class="topbar compact">
          <div><div class="eyebrow">CLUB</div><h1>Infraestructura</h1></div>
          <div class="budget"><span>Disponible</span><strong>${fmtM(state.budget)}</strong></div>
        </header>
        <section class="stadiumHero">
          <div class="stadiumVisual stadiumVisual--image"><img class="stadiumStageImage" src="${current.image}" alt="${current.title} ${current.label}"/></div>
          <div class="stadiumMeta"><div><span>${current.label}</span><h2>${current.title}</h2></div><div><strong>${current.capacity.toLocaleString('es-ES')}</strong><span>espectadores</span></div></div>
        </section>
        <section class="sectionBlock">
          <div class="sectionHeader"><div><span>EVOLUCIÓN</span><h3>Plan del estadio</h3></div><small>5 fases</small></div>
          <div class="stadiumStageRail">${STADIUM_STAGES.map((stage, index) => `<div class="stageChip ${index === state.stadium.level ? 'current' : index < state.stadium.level ? 'done' : 'locked'}"><img src="${stage.image}" alt="${stage.label}"/><strong>${index + 1}</strong><span>${stage.capacity.toLocaleString('es-ES')}</span></div>`).join('')}</div>
        </section>
        <section class="sectionBlock">
          <div class="sectionHeader"><div><span>NIVELES</span><h3>Instalaciones</h3></div><small>Máx. 5</small></div>
          <div class="facilityList">${levels.map(([label, value]) => `<div class="facility"><span>${label}</span><div class="levelDots">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= value ? 'on' : ''}"></i>`).join('')}</div><strong>${value}</strong></div>`).join('')}</div>
        </section>
        <section class="upgradeCard">
          <div class="upgradeTop"><div><span>PROYECTO</span><h3>${next ? next.label : 'Proyecto completado'}</h3></div><b>${next ? `+${next.capacity - current.capacity}` : 'FULL'}</b></div>
          <div class="upgradeMetrics">
            <div><span>Actual</span><strong>${current.capacity.toLocaleString('es-ES')}</strong></div>

          <button class="primaryButton" data-action="upgrade" ${!next || state.budget < current.nextCost ? 'disabled' : ''}>${!next ? 'Proyecto completado' : state.budget < current.nextCost ? 'Presupuesto insuficiente' : 'Aprobar reforma'}</button>
          <small class="note">Cada vez que apruebas una reforma, el estadio pasa a la siguiente visual y se actualiza el aforo.</small>
        </section>
      </div>`;
  }

  function more() {
    const standings = table();
    return `
      <div class="screen">
        <header class="topbar compact"><div><div class="eyebrow">TEMPORADA</div><h1>Competición</h1></div><div class="seasonTag">26/27</div></header>
        <section class="sectionBlock tableBlock">
          <div class="sectionHeader"><div><span>LIGA</span><h3>Clasificación</h3></div><small>J${Math.max(0, state.currentMatchday - 1)}</small></div>
          <div class="leagueTable">
            <div class="leagueRow header"><span>#</span><span>Club</span><span>PJ</span><span>DG</span><span>PTS</span></div>
            ${standings.map((t, i) => `<div class="leagueRow ${t.id === state.userTeamId ? 'mine' : ''}"><span>${i + 1}</span><span>${mark(t.short, 'sm')}${t.short}</span><span>${t.played}</span><span>${t.gf - t.ga > 0 ? '+' : ''}${t.gf - t.ga}</span><strong>${t.points}</strong></div>`).join('')}
          </div>
        </section>
        <section class="sectionBlock">
          <div class="sectionHeader"><div><span>FINANZAS</span><h3>Últimos movimientos</h3></div><strong>${fmtM(state.budget)}</strong></div>

        </section>
        <button class="dangerButton" data-action="reset">Reiniciar partida MVP</button>
        <p class="buildTag">Club Manager MVP · build 0.2.0</p>
      </div>`;

  function render() {
    const body = tab === 'home' ? home() : tab === 'team' ? teamScreen() : tab === 'market' ? market() : tab === 'club' ? club() : more();
    $app.innerHTML = `<div class="appContent">${body}</div>${nav()}${sheet(detailPlayer)}`;
  }

  function handleClick(event) {
    const navBtn = event.target.closest('[data-nav]');
    if (navBtn) {
      tab = navBtn.dataset.nav;
      selectedPlayer = null;
      detailPlayer = null;
      render();
      return;
    }
    const actionBtn = event.target.closest('[data-action]');
    if (actionBtn) {
      const action = actionBtn.dataset.action;
      if (action === 'simulate') simulateMatchday();
      if (action === 'upgrade') upgrade();
      if (action === 'reset') {
        localStorage.removeItem(SAVE_KEY);
        localStorage.removeItem(OLD_SAVE_KEY);
        state = createGame();
        tab = 'home';
        selectedPlayer = null;
        detailPlayer = null;
        save();
        render();
      }
      return;
    }
    const playerBtn = event.target.closest('[data-player]');
    if (playerBtn) {
      tapPlayer(playerBtn.dataset.player);
      return;
    }
    const filterBtn = event.target.closest('[data-filter]');
    if (filterBtn) {
      marketFilter = filterBtn.dataset.filter;
      render();
      return;
    }
    const buyBtn = event.target.closest('[data-buy]');
    if (buyBtn) {
      buy(buyBtn.dataset.buy);
      return;
    }
    const detailBtn = event.target.closest('[data-detail]');
    if (detailBtn) {
      detailPlayer = player(detailBtn.dataset.detail);
      render();
      return;
    }
    const closeSheet = event.target.closest('[data-close-sheet]');
    if (closeSheet) {
      detailPlayer = null;
      render();
    }
  }

  $app.addEventListener('click', handleClick);
  render();

})();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
}
if ('caches' in window) {
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
}
</script></body>
</html>
